# https://taskfile.dev
# Taskfile.env.yml — Ciclo de vida del entorno Docker
# Solo usa plugins/core y docker compose directamente (sin plugins project-specific)
version: '3'

tasks:
  start:
    desc: Arrancar el entorno Docker, bootstrap si falta .env o datos
    cmds:
      - bash {{.LOCAL_OPS_SH}} env-start

  stop:
    desc: Parar el entorno Docker
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose stop
      - cd {{.DOCKER_DIR}} && docker compose down

  restart:
    desc: Reiniciar el contenedor Liferay
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose restart liferay

  logs:
    desc: "Ver logs en tiempo real. Ej: task env:logs SINCE=10m"
    vars:
      SINCE: '{{.SINCE | default "5m"}}'
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose logs --follow --since={{.SINCE}}

  init:
    desc: "Inicializar variables del entorno actual. Ej: task env:init -- --clone-volumes"
    cmds:
      - bash {{.LOCAL_OPS_SH}} env-init {{.CLI_ARGS}}

  restore:
    desc: Restaurar datos del entorno (worktree o principal)
    cmds:
      - bash {{.LOCAL_OPS_SH}} worktree-restore {{.NAME | default ""}}

  clean:
    desc: "DESTRUCTIVO: eliminar todos los datos locales (volúmenes Docker)"
    prompt: "¿Continuar? Esto eliminará TODOS los datos locales."
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose down -v

  psql:
    desc: Shell PostgreSQL del entorno local
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose exec postgres psql -U ${POSTGRES_USER:-liferay} -d ${POSTGRES_DB:-liferay}
