# https://taskfile.dev
# Taskfile.env.yml — Ciclo de vida del entorno Docker
version: '3'

tasks:
  start:
    desc: Arrancar el entorno Docker, bootstrap local si falta
    cmds:
      - bash {{.LOCAL_OPS_SH}} env-start

  stop:
    desc: Parar el entorno Docker
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose stop
      - cd {{.DOCKER_DIR}} && docker compose down

  restart:
    desc: Reiniciar el contenedor principal
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose restart liferay

  recreate:
    desc: Recrear el contenedor (re-aplica configs)
    cmds:
      - bash {{.LCP_OPS_SH}} doclib-mount || true
      - cd {{.DOCKER_DIR}} && docker compose stop liferay
      - cd {{.DOCKER_DIR}} && docker compose up -d --force-recreate liferay

  logs:
    desc: "Ver logs en tiempo real. Ej: task env:logs SINCE=10m"
    vars:
      SINCE: '{{.SINCE | default "5m"}}'
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose logs --follow --since={{.SINCE}}

  setup:
    desc: Inicializar el entorno completo (primera vez)
    cmds:
      - bash {{.LOCAL_OPS_SH}} setup {{.CLI_ARGS}}

  setup-full:
    desc: "Setup completo desde cero: imágenes, BD y doclib en background. Ej: task env:setup-full DOCLIB_DEST=/ruta/destino"
    cmds:
      - bash {{.LOCAL_OPS_SH}} setup
      - bash {{.DEV_ENV_CLI}}/plugins/liferay/deploy.sh run_prepare_build
      - bash {{.LCP_OPS_SH}} db-download
      - bash {{.LCP_OPS_SH}} doclib-download-bg {{if .DOCLIB_DEST}}--doclib-dest "{{.DOCLIB_DEST}}"{{end}}
      - bash {{.LCP_OPS_SH}} db-import
      - bash {{.LCP_OPS_SH}} doclib-mount || true
      - cd {{.DOCKER_DIR}} && docker compose up -d
      - bash {{.LOCAL_OPS_SH}} post-start

  init:
    desc: "Inicializar variables de entorno del entorno actual. Ej: task env:init -- --clone-volumes"
    cmds:
      - bash {{.LOCAL_OPS_SH}} env-init {{.CLI_ARGS}}

  restore:
    desc: Restaurar datos del entorno actual
    cmds:
      - bash {{.LOCAL_OPS_SH}} worktree-restore {{.NAME | default ""}}

  clean:
    desc: "DESTRUCTIVO: elimina todos los datos locales (volúmenes Docker y bind mounts)"
    prompt: "¿Continuar? Esto eliminará TODOS los datos locales."
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose down -v
      - |
        doclib_vol=$(awk -F= '$1=="DOCLIB_VOLUME_NAME"{print $2; exit}' {{.DOCKER_DIR}}/.env)
        doclib_vol="${doclib_vol:-labweb-doclib}"
        docker volume rm "${doclib_vol}" 2>/dev/null || true
        data_root=$(awk -F= '$1=="ENV_DATA_ROOT"{print $2; exit}' {{.DOCKER_DIR}}/.env)
        data_root="${data_root:-./data/default}"
        case "${data_root}" in
          /*) data_root_resolved="${data_root}" ;;
          *) data_root_resolved="{{.DOCKER_DIR}}/${data_root}" ;;
        esac
        if [ -d "${data_root_resolved}" ]; then
          echo "[INFO] Eliminando bind mounts en ${data_root_resolved}..."
          docker run --rm -v "${data_root_resolved}:/target" alpine sh -c "rm -rf /target/* /target/.[!.]* /target/..?*"
          echo "[INFO] Datos eliminados: ${data_root_resolved}"
        fi

  shell:
    desc: Abrir shell bash en el contenedor principal
    cmds:
      - bash {{.DEV_ENV_CLI}}/plugins/liferay/ops.sh shell

  psql:
    desc: Shell PostgreSQL del entorno local
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose exec postgres psql -U ${POSTGRES_USER:-ub} -d ${POSTGRES_DB:-ub}

  info:
    desc: Estado completo del entorno
    cmds:
      - bash {{.DEV_ENV_CLI}}/plugins/liferay/ops.sh info

  status:
    desc: Estado observacional del entorno en JSON
    cmds:
      - bash {{.DEV_ENV_CLI}}/plugins/liferay/ops.sh status {{.CLI_ARGS}}

  is-healthy:
    desc: Exit code 0 solo si el portal está healthy
    cmds:
      - bash {{.DEV_ENV_CLI}}/plugins/liferay/ops.sh is-healthy

  wait:
    desc: "Esperar a que Liferay quede healthy. Ej: task env:wait TIMEOUT=600 POLL=10"
    vars:
      TIMEOUT: '{{.TIMEOUT | default "600"}}'
      POLL: '{{.POLL | default "10"}}'
    cmds:
      - bash {{.DEV_ENV_CLI}}/plugins/liferay/ops.sh wait --timeout {{.TIMEOUT}} --poll {{.POLL}} {{.CLI_ARGS}}
