# https://taskfile.dev
# Taskfile.env.yml — Ciclo de vida del entorno Docker
version: '3'

tasks:
  start:
    desc: Arrancar el entorno Docker, bootstrap local si falta
    cmds:
      - bash {{.LOCAL_OPS_SH}} env-start

  stop:
    desc: Parar el entorno Docker
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose stop
      - cd {{.DOCKER_DIR}} && docker compose down

  restart:
    desc: Reiniciar el contenedor principal
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose restart liferay

  recreate:
    desc: Recrear el contenedor (re-aplica configs)
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose up -d --force-recreate liferay

  logs:
    desc: "Ver logs en tiempo real. Ej: task env:logs SINCE=10m"
    vars:
      SINCE: '{{.SINCE | default "5m"}}'
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose logs --follow --since={{.SINCE}}

  setup:
    desc: Inicializar el entorno completo (primera vez)
    cmds:
      - bash {{.LOCAL_OPS_SH}} setup {{.CLI_ARGS}}

  setup-full:
    desc: "Setup completo desde cero: imágenes, BD y doclib en background. Ej: task env:setup-full DOCLIB_DEST=/Volumes/disco/temp"
    cmds:
      - bash {{.LOCAL_OPS_SH}} setup --auto {{if .DOCLIB_DEST}}--doclib-dest {{.DOCLIB_DEST}}{{end}} {{.CLI_ARGS}}

  init:
    desc: "Inicializar variables de entorno del entorno actual. Ej: task env:init -- --clone-volumes"
    cmds:
      - bash {{.LOCAL_OPS_SH}} env-init {{.CLI_ARGS}}

  restore:
    desc: Restaurar datos del entorno actual
    cmds:
      - bash {{.LOCAL_OPS_SH}} worktree-restore {{.NAME | default ""}}

  clean:
    desc: "DESTRUCTIVO: elimina todos los datos locales (volúmenes Docker y bind mounts)"
    prompt: "¿Continuar? Esto eliminará TODOS los datos locales."
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose down -v

  shell:
    desc: Abrir shell bash en el contenedor principal
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose exec liferay bash

  psql:
    desc: Shell PostgreSQL del entorno local
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose exec postgres psql -U ${POSTGRES_USER:-ub} -d ${POSTGRES_DB:-ub}

  info:
    desc: Estado completo del entorno
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose ps
      - cd {{.DOCKER_DIR}} && docker compose exec liferay cat /opt/liferay/container_status 2>/dev/null || true

  status:
    desc: Estado observacional del entorno en JSON
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose ps --format json

  is-healthy:
    desc: Exit code 0 solo si el portal está healthy
    cmds:
      - cd {{.DOCKER_DIR}} && docker compose exec liferay curl -sf http://localhost:8080/c/portal/layout

  wait:
    desc: "Esperar a que Liferay quede healthy. Ej: task env:wait TIMEOUT=600 POLL=10"
    vars:
      TIMEOUT: '{{.TIMEOUT | default "300"}}'
      POLL: '{{.POLL | default "15"}}'
    cmds:
      - |
        deadline=$(( $(date +%s) + {{.TIMEOUT}} ))
        while [ $(date +%s) -lt $deadline ]; do
          if cd {{.DOCKER_DIR}} && docker compose exec liferay curl -sf http://localhost:8080/c/portal/layout >/dev/null 2>&1; then
            echo "Liferay healthy"
            exit 0
          fi
          echo "Esperando... (poll {{.POLL}}s)"
          sleep {{.POLL}}
        done
        echo "Timeout esperando a Liferay" >&2
        exit 1
